# dsh-prompt-doctor bundle patch：一行宿主半。
#
# 宿主半（lib/index.js）负责：读 ~/.dsh/sessions 的会话日志 → 归因 → 规则候选
# → 校验后写 ~/.agents/AGENTS.md 的托管块，并注册四个 prompt_* 工具。
#
# 宿主面（不是 agent preset 行）的原因：日志和数据目录是全机器共用的，每个会话都要用到。
#
# 注意：**只在这里插一次**。profile 的 cordis.patch.yml 里不要再手写同样的 id，
# 上一版就是因为两处插了同一个 id 而整组被跳过。
- insert:
    - id: prompt-doctor
      name: 'dsh-prompt-doctor'
